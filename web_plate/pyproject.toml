[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-nader"
version = "0.1.0"
description = "TopoNader: event-triggered NADER-assisted surrogate optimization for topology design"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "requests>=2.28",
]

[project.scripts]
toponader = "topo_nader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topo_nader*"]

[tool.setuptools.package-data]
"topo_nader.agents" = ["human_suggestions_v1.json"]

