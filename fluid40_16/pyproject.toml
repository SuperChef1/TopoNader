[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-nader-fluid40-16"
version = "0.1.0"
description = "Independent TopoNader adaptation for the legacy 40x16 binary fluid case"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.0", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topo_nader*"]
